site_name: Craftserve Docs
repo_url: https://github.com/Craftserve/docs/tree/c3

theme:
  name: material
  custom_dir: theme
  logo: common/img/logo.png
  language: en

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascript/redirect.js

extra:
  alternate:
    - name: English
      link: /en-US/
      lang: en
    - name: Polski
      link: /pl-PL/
      lang: pl
  analytics:
    provider: custom

exclude_docs: |
  todo.md

plugins:
  - glightbox

markdown_extensions:
  - attr_list
  - toc:
      permalink: true

nav:
  - Polski:
      - Oficjalny zestaw dokumentacji, poradników i zasobów Craftserve: pl-PL/README.md
      - Ogólne:
          - Ustawienia: pl-PL/Ogólne/ustawienia.md
          - Poradnik FTP – Łączenie się z Craftserve: pl-PL/Ogólne/ftp.md
          - Kopie zapasowe, czyli Backupy: pl-PL/Ogólne/backups.md
          - Czym jest MySQL?: pl-PL/Ogólne/mysql.md
          - Migracje serwerów: pl-PL/Ogólne/migrations.md
          - Jak stworzyć paczkę na Craftserve Dodatki?: pl-PL/Ogólne/gallery-addons.md
      - Minecraft:
        - Instalacja i konfiguracja:
            - Instalacja modpacka: pl-PL/minecraft-java/modpack.md
            - Instalacja modpacka BetterMC (Fabric): pl-PL/minecraft-java/bettermc.md
            - Instalacja paczki YFLsmp: pl-PL/minecraft-java/yflsmp.md
            - Instalacja pluginów: pl-PL/minecraft-java/plugins.md
            - Instalacja datapacków: pl-PL/minecraft-java/datapacks.md
            - SpongeForge: pl-PL/minecraft-java/spongeforge.md

        - Administracja i ustawienia serwera:
