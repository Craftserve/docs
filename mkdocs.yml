            - Polecenia CraftserveAgent: pl-PL/minecraft-java/csrvagentkomendy.md
            - Świat serwerowy: pl-PL/minecraft-java/world.md
            - Serwerowy resource pack: pl-PL/minecraft-java/resource-pack.md
            - Online mode: pl-PL/minecraft-java/online-mode.md
            - Pregenerowanie świata: pl-PL/minecraft-java/pregen.md
            - Ustawianie własnej domeny do serwera Minecraft: pl-PL/minecraft-java/domain.md

